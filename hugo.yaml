baseURL: https://kccom-y.github.io/
languageCode: en-us
title: Chae Young Sim
theme: PaperMod

paginate: 10

params:
  env: production
  description: "Chae Young Sim - Ph.D. Student at Korea University"
  author: Chae Young Sim

  # Profile mode for homepage
  profileMode:
    enabled: true
    title: Chae Young Sim
    subtitle: |
      Ph.D. Student @ [Korea University](https://www.korea.ac.kr)

    imageUrl: img/profile.jpg
    imageWidth: 150
    imageHeight: 150
    imageTitle: Chae Young Sim
    buttons:
      - name: Pub.
        url: /publications/
      - name: CV
        url: /cv/

  # Social icons on homepage
  socialIcons:
    - name: github
      url: https://github.com/kccom-y
    - name: email
      url: mailto:simcy1024@korea.ac.kr

  # Dark mode
  defaultTheme: auto
  disableThemeToggle: false

  # UI options
  showReadingTime: false
  showShareButtons: false
  showBreadCrumbs: false
  showPostNavLinks: false
  showCodeCopyButtons: true
  hideMeta: true

  # Cover image defaults
  cover:
    linkFullImages: true
    responsiveImages: true

  # Assets
  assets:
    disableFingerprinting: false

menu:
  main:
    - identifier: about
      name: About
      url: /
      weight: 10
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 20
    - identifier: cv
      name: CV
      url: /cv/
      weight: 40
outputs:
  home:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
